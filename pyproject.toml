[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-ipp-bridge"
version = "0.1.0"
description = "Unofficial Linux and Windows compatibility client for PaperCut Hive"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Charles Culver"}, {name = "Edge Case Software"}]

[project.urls]
Homepage = "https://edgecasesoftware.dev"

[project.scripts]
hive-ipp-bridge = "hive_ipp_bridge.cli:main"

[project.optional-dependencies]
windows = ["pywin32==312"]
windows-build = ["pywin32==312", "pyinstaller==6.22.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
